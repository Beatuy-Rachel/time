name: time-record

services:
  app:
    image: "${IMAGE:-ghcr.io/beatuy-rachel/time}:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
