name: time-record

services:
  app:
    image: "${IMAGE:-ghcr.io/beatuy-rachel/time}:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in .env}"
    volumes:
      - "${DATA_VOLUME:-./data}:/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
